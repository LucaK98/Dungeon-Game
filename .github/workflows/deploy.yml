name: Deploy to GitHub Pages

# The site is the main branch. A test version of the branch "claude/handy-ui" (new phone screen)
# is published next to it under /beta/, so it can be tried out without touching the real game.
# Runs on pushes to main and after the CI of a branch push (workflow_run runs in main's context).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'claude/handy-ui')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # The test version of the new phone screen (skipped if the branch is gone).
      - uses: actions/checkout@v4
        id: beta
        continue-on-error: true
        with:
          ref: claude/handy-ui
          path: beta-src
      - name: Build beta
        if: steps.beta.outcome == 'success'
        working-directory: beta-src
        run: |
          npm ci
          npm run build -- --outDir ../dist/beta --emptyOutDir
        env:
          VITE_BASE: /${{ github.event.repository.name }}/beta/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
